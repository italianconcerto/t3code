name: Fork desktop release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-desktop-release
  cancel-in-progress: true

jobs:
  linux-resource-monitor:
    name: Build Linux x64 resource monitor
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build resource monitor
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml

      - name: Upload resource monitor
        uses: actions/upload-artifact@v7
        with:
          name: fork-resource-monitor-linux-x64
          path: native/resource-monitor/target/release/t3-resource-monitor
          if-no-files-found: error

  release:
    name: Build and publish macOS Apple Silicon
    needs: linux-resource-monitor
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@v6
        with:
          path: native/resource-monitor/target/aarch64-apple-darwin/release/t3-resource-monitor
          key: fork-resource-monitor-aarch64-apple-darwin-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - id: version
        name: Resolve fork version
        shell: bash
        run: |
          set -euo pipefail
          version="1.0.${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          cp .env.example .env

      - name: Build server release
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set --prefix apps/server version="${{ steps.version.outputs.version }}"
          vp run --filter t3 build

      - name: Download Linux resource monitor
        uses: actions/download-artifact@v8
        with:
          name: fork-resource-monitor-linux-x64
          path: apps/server/dist/resource-monitor/linux-x64

      - name: Verify packaged Claude subagent reader
        shell: bash
        run: |
          T3_TEST_SUBAGENT_READER_URL="file://$PWD/apps/server/dist/claude-subagent-reader.mjs" \
            vp test run apps/server/src/provider/claudeSubagentTranscript.test.ts --maxWorkers=1

      - name: Pack server release
        shell: bash
        run: |
          set -euo pipefail
          chmod +x apps/server/dist/resource-monitor/linux-x64/t3-resource-monitor
          test -x apps/server/dist/resource-monitor/linux-x64/t3-resource-monitor
          node apps/server/scripts/cli.ts pack \
            --app-version "${{ steps.version.outputs.version }}" \
            --out-dir release
          tar -tzf "release/t3-${{ steps.version.outputs.version }}.tgz" \
            | grep -qx 'package/dist/client/index.html'
          tar -tzf "release/t3-${{ steps.version.outputs.version }}.tgz" \
            | grep -qx 'package/dist/resource-monitor/linux-x64/t3-resource-monitor'

      - name: Build Developer ID signed macOS release
        shell: bash
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.resource_monitor_cache.outputs.cache-hit == 'true' }}
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CSC_NAME: "GradientLabs S.R.L. (GPYS228MLV)"
          # This fork has no Associated Domains profile for native Clerk passkeys.
          T3CODE_MACOS_PASSKEYS_ENABLED: "false"
        run: |
          set -euo pipefail
          test -n "$CSC_LINK" || { echo "Missing MACOS_CERTIFICATE secret"; exit 1; }
          test -n "$CSC_KEY_PASSWORD" || { echo "Missing MACOS_CERTIFICATE_PASSWORD secret"; exit 1; }
          vp run dist:desktop:artifact \
            --platform mac \
            --target dmg \
            --arch arm64 \
            --build-version "${{ steps.version.outputs.version }}" \
            --signed \
            --verbose

      - name: Verify distributed macOS signature
        shell: bash
        run: |
          set -euo pipefail
          verification_dir=$(mktemp -d "$RUNNER_TEMP/t3-signature.XXXXXX")
          archives=(release/*.zip)
          test "${#archives[@]}" -eq 1
          ditto -x -k "${archives[0]}" "$verification_dir"
          apps=("$verification_dir"/*.app)
          test "${#apps[@]}" -eq 1
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          codesign -dv --verbose=4 "${apps[0]}" 2> "$verification_dir/signature.txt"
          grep -Fx 'TeamIdentifier=GPYS228MLV' "$verification_dir/signature.txt"
          grep -Fx 'Authority=Developer ID Application: GradientLabs S.R.L. (GPYS228MLV)' "$verification_dir/signature.txt"

      - name: Publish fork release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: T3 Code fork ${{ steps.version.outputs.version }}
          body: Automated Apple Silicon desktop and Linux server builds from `${{ github.sha }}`.
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*-mac.yml
            release/t3-*.tgz
